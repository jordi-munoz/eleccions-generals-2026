# Rebuilds the default projection every morning with the latest polls and
# publishes projection.json and projection.csv on GitHub Pages:
#   https://jordi-munoz.github.io/eleccions-generals-2026/projection.json
#   https://jordi-munoz.github.io/eleccions-generals-2026/projection.csv
# If a run fails (no polls, a source down), the files of the last good run
# stay online.

name: Publish projection data

on:
  schedule:
    - cron: "30 5 * * *"   # 05:30 UTC: 07:30 in Madrid in summer, 06:30 in winter
  workflow_dispatch:         # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - "R/**"
      - "scripts/export_data.R"
      - "data/aa_prior.csv"
      - "PROV_02_202307_1/**"
      - ".github/workflows/publish-data.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readxl
            any::httr2
            any::rvest
            any::xml2
            any::jsonlite

      - name: Run the model and write the files
        run: Rscript scripts/export_data.R _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
